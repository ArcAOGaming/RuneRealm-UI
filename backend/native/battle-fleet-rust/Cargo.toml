[package]
name = "runerealm-battle-fleet-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "runerealm_battle_worker"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
